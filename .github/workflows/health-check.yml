name: System Health Monitor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Bash syntax
        run: |
          bash -n scripts/health-check.sh
          bash -n scripts/test-health-check.sh

      - name: Run health monitor
        run: bash scripts/health-check.sh

      - name: Run smoke test
        run: bash scripts/test-health-check.sh
